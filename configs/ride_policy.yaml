# RIDE policy definition used by evaluate.py (ride.rl_config in configs/eval/*).
#
# evaluate.py builds the RIDE network from `ride_model` and loads the weights
# from data.ride_checkpoint. Point RIDE_CHECKPOINT at a MORAD snapshot to
# evaluate it; leave it unset to evaluate the pretrained RIDE checkpoint.
# The in-training validation workers set RIDE_CHECKPOINT themselves.

data:
  pool_manifest: "${RIDE_RL_POOL:-artifacts/pools/test153.pt}"
  ride_checkpoint: "${RIDE_CHECKPOINT:-artifacts/models/ride/checkpoint.h5}"
  condition_noise_scale: 0.0
  condition_snapshot_enabled: false
  x0_representation: one_hot_01

ride_model:
  node_in_dim: [15, 4]
  node_h_dim: [256, 24]
  edge_in_dim: [131, 3]
  edge_h_dim: [128, 4]
  num_layers: 5
  drop_rate: 0.5
  out_dim: 4
  time_cond: true

noise_schedule:
  schedule: linear
  continuous_beta_0: 0.1
  continuous_beta_1: 20.0
  eps: 0.001

rollout:
  group_size: 2
  sampler:
    name: x0_renoise
    n_steps: 50
    version: v1
  temperature:
    initial: 0.8
    min: 0.2
    max: 1.5
    step: 0.1
  rescue:
    max_rounds: 0
    min_unique_sequences: 2
    min_valid_sequences: 2

reward:
  oracle:
    backend: local_jsonl_worker
    python: "${RHOFOLD_PYTHON:-python}"
    worker_script: scripts/rhofold_oracle_worker.py
    ckpt: "${RHOFOLD_CHECKPOINT:-../third_party/rhofold_protocol/checkpoints/rhofold_pretrained_params.pt}"
    output_dir: "${RIDE_RL_ORACLE_OUTPUT:-outputs/rhofold_predictions}"
    timeout_sec: 120
    device: "${RHOFOLD_DEVICE:-cuda:0}"
    fake: false
  metric_cache:
    dir: "${RIDE_RL_CACHE:-cache/rl_metrics}"
    metric_version: ride_evaluator_v1
    alignment_config: c4p_kabsch_centered
  composer:
    preset: initial_plan_strict
    good:
      gdt_ts: 0.5
      tm_score: 0.45
      rmsd: 2.0

advantage:
  scale:
    kind: ema
    decay: 0.95
    epsilon: 1.0e-6
    min_valid: 2

trainer:
  loss:
    nft_beta: 0.1
    reference_weight: 0.0
    k_t: 4
    weighting: uniform_eps
    residual_normalization: none
    divide_by_beta: true
  optim:
    lr: 1.0e-5
    weight_decay: 0.0
    grad_clip_norm: 1.0
    gradient_accumulation_steps: 1
    amp: false
    microbatch_size: 1
  ema:
    decay_max: 0.995
    update_interval: 1

runtime:
  seed: 0
  device: "${RIDE_DEVICE:-cuda:0}"
  budget:
    max_outer_steps: 1
    max_oracle_calls: 8
    max_wall_hours: 0.5
    checkpoint_every_oracle_calls: 2

logging:
  jsonl: outputs/ride_policy/events.jsonl
  wandb:
    enabled: false

checkpoint:
  dir: outputs/ride_policy/checkpoints
  save_latest: true

evaluation:
  deterministic_anchor_temperature: 0.0
  group_size: 2
