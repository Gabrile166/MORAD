schema_version: ride_ribodiffusion_eval.v1

# Checkpoint comparison: same protocol as test153.yaml, but all eight candidates
# of every target are folded and scored, so per-target means over eight
# candidates (and their standard errors across targets) can be reported.
#
#   RIDE_CHECKPOINT=outputs/morad/validation/policy_step000180.pt \
#   python evaluate.py --config configs/eval/test153_8cand.yaml --output-dir outputs/eval/checkpoints/update180
ride:
  rl_config: configs/ride_policy.yaml
  pool_manifest: "${EVAL_POOL:-artifacts/pools/test153.pt}"
  device: "${RIDE_DEVICE:-cuda:0}"

sampling:
  generator: ride
  seed: 20260823
  target_limit: 153
  n_samples: 8
  paper_diversity: true
  temperature: 0.8

metrics:
  sequence:
    enabled: true
  secondary:
    enabled: true
    rnafold_binary: "${RNAFOLD_BINARY:-RNAfold}"
    timeout_s: 30
    native_f1_threshold: 0.7
  tertiary:
    enabled: true
    candidate_limit_per_target: 8
    rhofold_python: "${RHOFOLD_PYTHON:-python}"
    worker_script: scripts/rhofold_oracle_worker.py
    checkpoint: "${RHOFOLD_CHECKPOINT:-../third_party/rhofold_protocol/checkpoints/rhofold_pretrained_params.pt}"
    cache_dir: cache/evaluation/rhofold
    timeout_s: 300
    device: "${RHOFOLD_DEVICE:-cuda:0}"
    usalign_binary: "${USALIGN_BINARY:-../third_party/USalign/USalign}"
    usalign_timeout_s: 120
  rfam:
    enabled: false
    reason: "not part of the reported protocol"
  drfold:
    enabled: false
    reason: "not part of the reported protocol"

output:
  dir: outputs/eval/checkpoints
