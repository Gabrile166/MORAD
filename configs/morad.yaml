# MORAD: the reported run (Tables 1-3, Figure 3).
#
# Pretrained RIDE, six-component MORAD reward, 527 training targets, three
# epochs on 4 GPUs (4 targets x 8 candidates per update). Held-out evaluation on
# the 153 test targets every 10 updates, from update 0 to 390. The reported
# model is the last checkpoint, update 390:
#   outputs/morad/validation/policy_step000390.pt
#
# Launch with scripts/train_morad.sh (torchrun, 4 processes).

data:
  pool_manifest: artifacts/pools/train527.pt
  ride_checkpoint: artifacts/models/ride/checkpoint.h5
  condition_noise_scale: 0.0
  condition_snapshot_enabled: false
  x0_representation: one_hot_01

ride_model:
  node_in_dim: [15, 4]
  node_h_dim: [256, 24]
  edge_in_dim: [131, 3]
  edge_h_dim: [128, 4]
  num_layers: 5
  drop_rate: 0.5
  out_dim: 4
  time_cond: true

noise_schedule:
  schedule: linear
  continuous_beta_0: 0.1
  continuous_beta_1: 20.0
  eps: 0.001

rollout:
  # Eight candidates per target backbone (one GRPO group).
  group_size: 8
  sampler:
    # 50 steps; each predicts x0 and re-noises it.
    name: x0_renoise
    n_steps: 50
    version: v1
  temperature:
    initial: 1.0
    min: 0.2
    max: 1.5
    step: 0.1
  rescue:
    # One resampling round, at a temperature raised by `step`, when a group has
    # fewer than two unique or valid sequences.
    max_rounds: 1
    min_unique_sequences: 2
    min_valid_sequences: 2

reward:
  oracle:
    backend: local_jsonl_worker
    python: ${RHOFOLD_PYTHON:-python}
    worker_script: scripts/rhofold_oracle_worker.py
    ckpt: ${RHOFOLD_CHECKPOINT:-../third_party/rhofold_protocol/checkpoints/rhofold_pretrained_params.pt}
    output_dir: outputs/morad/oracle
    timeout_sec: 600
    device: cuda:0          # overridden per rank by train.py
    fake: false
  metric_cache:
    dir: ${RIDE_RL_CACHE:-cache/rl_metrics}
    metric_version: ride_evaluator_v2_geo6
    alignment_config: c4p_kabsch_centered
  composer:
    # Six bounded desirability scores combined by a weighted geometric mean:
    # GDT-TS .25 / TM-score .30 / RMSD .30 / pairing MCC .05 /
    # normalized ensemble defect .05 / composition KL .05.
    # Anchors and weights are listed in the paper appendix and in
    # src/rl/reward.py; the weights come from scripts/reward/reward_design.py.
    preset: morad
    good:
      gdt_ts: 0.5
      tm_score: 0.5
      rmsd: 4.0

advantage:
  # Group-relative normalization: z-score within the eight candidates, clipped.
  group_normalize: true
  z_clip: 2.0
  scale:
    kind: ema
    decay: 0.95
    epsilon: 1.0e-06
    min_valid: 2

trainer:
  loss:
    nft_beta: 0.1             # beta
    reference_weight: 0.02    # lambda_ref
    k_t: 8                    # noise draws per candidate
    weighting: uniform_eps
    residual_normalization: none
    divide_by_beta: true
  optim:
    lr: 2.0e-4
    weight_decay: 0.0
    grad_clip_norm: 1.0
    gradient_accumulation_steps: 1
    amp: false
    microbatch_size: 1
    # 5% linear warmup, then cosine decay to 0.3 x lr. The schedule spans three
    # full epochs (527 targets x 3 / 4 targets per update = 395 updates).
    lr_schedule: warmup_cosine
    lr_warmup_ratio: 0.05
    lr_min_ratio: 0.3
    lr_total_steps: 395
  ema:
    # rho_u = min(0.999, (1 + u) / (10 + u))
    decay_max: 0.999
    update_interval: 1

runtime:
  seed: 0
  device: cuda
  mode: train
  ranks_per_target: 1
  epochs: 3
  shuffle_targets: true
  shuffle_seed: 20260826
  budget:
    # The reported model is update 390, the last held-out evaluation point.
    max_outer_steps: 390
    max_oracle_calls: 200000
    max_wall_hours: 72.0
    checkpoint_every_oracle_calls: 128

validation:
  # Held-out evaluation during training (Figure 3): candidate 0 of each of the
  # 153 test targets, every 10 updates. Runs in detached worker processes and is
  # not used to select a checkpoint.
  enabled: true
  pool_manifest: artifacts/pools/test153.pt
  config: configs/eval/validation.yaml
  # Folding shards for the validation workers. They share the training GPUs;
  # RhoFold+ peaks under 11 GiB and training holds about 10 GiB of a 24 GiB card.
  devices: "cuda:0,cuda:1,cuda:2,cuda:3"
  test_freq: 10
  before_train: true
  n_samples: 8
  timeout_sec: 7200.0
  usalign_binary: ${USALIGN_BINARY:-../third_party/USalign/USalign}
  # Keep every policy snapshot (about 41 MB each), so any evaluated update,
  # e.g. the 180 / 230 / 340 / 390 checkpoint comparison, can be re-scored later.
  keep_runs: 0

logging:
  jsonl: outputs/morad/train.jsonl
  wandb:
    enabled: false
    project: morad
    name: morad-4gpu
    tags: [morad, 4gpu]

checkpoint:
  dir: outputs/morad/checkpoints
  save_latest: true

evaluation:
  deterministic_anchor_temperature: 0.0
  group_size: 2
